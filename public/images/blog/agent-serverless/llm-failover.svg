<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif"><title id="t">LLM failover chain</title><desc id="d">The synthesize step tries Groq first, then NVIDIA NIM, then falls back to a deterministic structural report. If a provider answers 404 because a model was retired, the agent lists the provider's models, picks the next available one and retries once.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4b8" stroke-opacity="0.06"/></pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa3bf"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#00d4b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
<marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
</defs>
<rect width="800" height="400" fill="#101b33"/><rect width="800" height="400" fill="url(#grid)"/>

<!-- retired-model loop -->
<path d="M95 118 C95 60, 205 60, 205 112" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ay)"/>
<text x="228" y="50" font-size="12" fill="#fcd34d" font-weight="700">404 · model retired</text>
<text x="228" y="67" font-size="11" fill="#fcd34d">GET /models → next available model → retry once</text>
<text x="228" y="83" font-size="11" fill="#8fa3bf">(same logic for both providers)</text>

<!-- providers -->
<rect x="40" y="120" width="210" height="72" rx="12" fill="#2a2414" stroke="#f59e0b" stroke-width="2.5"/>
<text x="60" y="148" font-size="11" fill="#fcd34d" font-weight="700">1 · PRIMARY</text>
<text x="60" y="172" font-size="17" fill="#fde68a" font-weight="700">Groq</text>
<text x="118" y="172" font-size="11" fill="#fcd34d">gpt-oss-120b</text>

<rect x="300" y="120" width="210" height="72" rx="12" fill="#2a2414" stroke="#f59e0b" stroke-width="2"/>
<text x="320" y="148" font-size="11" fill="#fcd34d" font-weight="700">2 · BACKUP</text>
<text x="320" y="172" font-size="17" fill="#fde68a" font-weight="700">NVIDIA NIM</text>
<text x="434" y="172" font-size="11" fill="#fcd34d">credits</text>

<rect x="560" y="120" width="200" height="72" rx="12" fill="#16243f" stroke="#00d4b8" stroke-width="2"/>
<text x="580" y="148" font-size="11" fill="#7ee8d9" font-weight="700">3 · BACKSTOP</text>
<text x="580" y="172" font-size="17" fill="#e6edf7" font-weight="700">Structural report</text>

<!-- failure edges -->
<path d="M250 156 H298" stroke="#f87171" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
<path d="M510 156 H558" stroke="#f87171" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)"/>
<text x="274" y="214" font-size="11" fill="#f87171" text-anchor="middle">error</text>
<text x="274" y="228" font-size="11" fill="#f87171" text-anchor="middle">or 45 s timeout</text>
<text x="534" y="214" font-size="11" fill="#f87171" text-anchor="middle">error</text>
<text x="534" y="228" font-size="11" fill="#f87171" text-anchor="middle">or timeout</text>

<!-- success edges -->
<path d="M145 192 V276" stroke="#00d4b8" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<path d="M405 192 V276" stroke="#00d4b8" stroke-width="2" fill="none" marker-end="url(#ag)"/>
<path d="M660 192 V276" stroke="#8fa3bf" stroke-width="2" fill="none" marker-end="url(#a)"/>

<rect x="40" y="278" width="470" height="56" rx="12" fill="#0f2f33" stroke="#00d4b8" stroke-width="2"/>
<text x="275" y="302" font-size="15" fill="#e6edf7" text-anchor="middle" font-weight="700">AI report · llmUsed: true</text>
<text x="275" y="321" font-size="11" fill="#7ee8d9" text-anchor="middle">validated JSON · cached for 24 h</text>

<rect x="560" y="278" width="200" height="56" rx="12" fill="#16243f" stroke="#8fa3bf" stroke-width="2"/>
<text x="660" y="302" font-size="15" fill="#e6edf7" text-anchor="middle" font-weight="700">Never an error page</text>
<text x="660" y="321" font-size="11" fill="#8fa3bf" text-anchor="middle">not cached · retried next time</text>

<text x="400" y="375" font-size="13" fill="#8fa3bf" text-anchor="middle">Active-passive across two providers, with plain code as the last line of defence</text>
</svg>
