<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="t"><title id="t">ETL vs ELT: transform before load in the MDM/R, transform after load in the analytics lakehouse</title>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="#101b33"/>
  <rect width="800" height="400" fill="url(#grid)"/>
  <ellipse cx="200" cy="60" rx="260" ry="180" fill="url(#g1)"/>
  <ellipse cx="600" cy="60" rx="260" ry="180" fill="url(#g2)"/>
  <text x="40" y="46" font-family="Consolas, ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#64748b">ETL vs ELT — SMART METERING USES BOTH</text>
  <line x1="400" y1="84" x2="400" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="200" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#60a5fa">ETL · MDM/R EDGE (BILLING)</text>
  <rect x="60" y="100" width="280" height="48" rx="8" fill="#1a2947" stroke="#10b981" stroke-width="1.5"/>
  <text x="200" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Source — raw interval reads</text>
  <text x="200" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">AMI head-end → MDM/R intake</text>
  <line x1="200" y1="148" x2="200" y2="170" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="200,172 196,165 204,165" fill="#64748b"/>
  <rect x="60" y="172" width="280" height="48" rx="8" fill="#1a2947" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f87171">Transform — VEE</text>
  <text x="200" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">validate · estimate · edit, before anything loads</text>
  <line x1="200" y1="220" x2="200" y2="242" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="200,244 196,237 204,237" fill="#64748b"/>
  <rect x="60" y="244" width="280" height="48" rx="8" fill="#1a2947" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Load — MDM/R repository</text>
  <text x="200" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">billing-ready, fully audited</text>
  <text x="200" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#64748b">« nothing unvalidated touches a bill »</text>

  <text x="600" y="84" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399">ELT · ANALYTICS LAKEHOUSE</text>
  <rect x="460" y="100" width="280" height="48" rx="8" fill="#1a2947" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="121" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Source — raw intervals</text>
  <text x="600" y="135" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">landed as-is, storage is cheap</text>
  <line x1="600" y1="148" x2="600" y2="170" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="600,172 596,165 604,165" fill="#64748b"/>
  <rect x="460" y="172" width="280" height="48" rx="8" fill="#1a2947" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Load — Delta Lake lakehouse</text>
  <text x="600" y="207" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">bronze / raw landing zone</text>
  <line x1="600" y1="220" x2="600" y2="242" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="600,244 596,237 604,237" fill="#64748b"/>
  <rect x="460" y="244" width="280" height="48" rx="8" fill="#1a2947" stroke="#0066ff" stroke-width="1.5"/>
  <text x="600" y="265" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Transform — Spark / Databricks</text>
  <text x="600" y="279" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#94a3b8">silver / gold, on demand</text>
  <text x="600" y="318" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#64748b">« land first, ask questions later »</text>

  <text x="400" y="360" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94a3b8">In metering: ETL guards billing · ELT powers analytics</text>
</svg>
